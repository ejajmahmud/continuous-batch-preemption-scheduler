[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-batch-preemption-scheduler"
version = "0.1.0"
description = "Multi-tenant continuous batch scheduler with priority tiering, iteration-level preemption, and fair-share scheduling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
continuous-batch-preemption-scheduler = "continuous_batch_preemption_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["continuous_batch_preemption_scheduler*"]
